---
- name: Create Jenkins Controller SSH identity
  hosts: jenkins_controller
  become: true

  tasks:
    - name: Create Jenkins SSH directory
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Generate dedicated Jenkins Agent SSH key
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N "" -f /var/lib/jenkins/.ssh/id_ed25519 -C "jenkins-controller-to-agent"
        creates: /var/lib/jenkins/.ssh/id_ed25519
      become_user: jenkins

    - name: Read Jenkins Agent public key
      ansible.builtin.slurp:
        src: /var/lib/jenkins/.ssh/id_ed25519.pub
      register: jenkins_agent_public_key

    - name: Scan Jenkins Agent SSH host key
      ansible.builtin.command:
        cmd: "ssh-keyscan -t ed25519 {{ hostvars['jenkins-agent']['private_ip'] }}"
      register: agent_host_key
      changed_when: false

    - name: Add Jenkins Agent to controller known_hosts
      ansible.builtin.known_hosts:
        path: /var/lib/jenkins/.ssh/known_hosts
        name: "{{ hostvars['jenkins-agent']['private_ip'] }}"
        key: "{{ agent_host_key.stdout }}"
        state: present

    - name: Set known_hosts ownership
      ansible.builtin.file:
        path: /var/lib/jenkins/.ssh/known_hosts
        owner: jenkins
        group: jenkins
        mode: "0644"

- name: Authorize Jenkins Controller on Jenkins Agent
  hosts: jenkins_agent
  become: true

  tasks:
    - name: Create Jenkins Agent SSH directory
      ansible.builtin.file:
        path: /home/jenkins/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Install controller public key for Jenkins user
      ansible.builtin.copy:
        content: "{{ hostvars['jenkins-controller']['jenkins_agent_public_key']['content'] | b64decode }}"
        dest: /home/jenkins/.ssh/authorized_keys
        owner: jenkins
        group: jenkins
        mode: "0600"
